<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Lead Studio</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #eef2ff;
        color: #172554;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main { text-align: center; }
      .mark {
        align-items: center;
        animation: pulse 1.4s ease-in-out infinite;
        background: #4f46e5;
        border-radius: 18px;
        color: #fff;
        display: inline-flex;
        font-size: 22px;
        font-weight: 700;
        height: 58px;
        justify-content: center;
        width: 58px;
      }
      h1 { font-size: 22px; margin: 22px 0 8px; }
      p { color: #64748b; font-size: 15px; margin: 0; }
      @keyframes pulse { 50% { transform: scale(.92); opacity: .78; } }
    </style>
  </head>
  <body>
    <main aria-live="polite" role="status">
      <div class="mark" aria-hidden="true">LL</div>
      <h1>Открываю Local Lead Studio</h1>
      <p>Подготавливаю базу и карточки лидов…</p>
    </main>
  </body>
</html>
